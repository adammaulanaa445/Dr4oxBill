name: dr4ox_bill
description: Aplikasi kasir desktop (POS) untuk bengkel motor Dr4ox Motor.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # SQLite untuk database lokal (desktop support via FFI)
  sqflite_common_ffi: ^2.0.0

  # Path dan direktori sistem
  path: ^1.8.3
  path_provider: ^2.1.1

  # Unik ID untuk nomor transaksi
  uuid: ^4.0.0

  # Format tanggal dan mata uang
  intl: ^0.18.0

  # Generate PDF struk dan laporan
  pdf: ^3.10.0
  printing: ^5.12.0

  # Pilih file foto produk dari laptop
  file_picker: ^5.3.0

  # Pemrosesan gambar
  image: ^4.1.0

  # Ekspor CSV laporan
  csv: ^5.0.0

  # Arsip ZIP untuk backup/restore
  archive: ^3.3.0

  # State management sederhana
  provider: ^6.0.0
  sqlite3_flutter_libs: 0.5.0
  sqflite_common_ffi_web: ^0.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

  # Generator ikon aplikasi dari logo
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Konfigurasi ikon aplikasi (Android dan Windows)
flutter_launcher_icons:
  image_path: "assets/images/dr4ox.png"
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/images/dr4ox.png"
    icon_size: 256